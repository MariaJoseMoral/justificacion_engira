resolucion_conflictos:

  prioridad_actividad:
    - coincidencia_concepto_exacto
    - coincidencia_nombre_archivo
    - coincidencia_ruta
    - coincidencia_texto

  permitir_multiples:
    tipo_documento: true
    funcion_documental: true
    canal_comunicacion: true
    area_tecnica: true

  seleccion_unica:
    actividad: true
    concepto_gasto: true
    documentacion_administrativa: true

  enviar_revision_manual_si:
    - empate_actividad
    - actividad_sin_concepto
    - concepto_sin_actividad
    - puntuacion_inferior_umbral
    - coincidencia_solo_en_texto
    - documento_economico_sin_partida