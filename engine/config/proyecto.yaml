proyecto:
  id: "engira_2025_2026"
  nombre: "enGira!"
  descripcion: "Plataforma digital para la movilidad, distribución y acompañamiento de profesionales de las artes escénicas."
  responsable: "María José Moral Morgado"
  entidad: "María José Moral Morgado"
  expediente: "19770-02535886"

subvencion:
  organismo: "Ministerio de Cultura"
  convocatoria: "Ayudas para la acción y la promoción cultural"
  importe_concedido: 25000.00
  presupuesto_total: 34180.00
  moneda: "EUR"

fechas:
  inicio_ejecucion: "2025-07-01"
  fin_ejecucion: "2026-06-30"
  fecha_limite_facturas: "2026-06-30"
  fecha_limite_pagos: "2026-09-30"

repositorio:
  raiz: "../.."


datos:
  raiz: "../../datos_engira"

rutas_entrada:
  bases_y_resolucion: "00_BASES_Y_RESOLUCION"
  proyecto_presentado: "01_PROYECTO_PRESENTADO"
  actividades: "02_ACTIVIDADES_REALIZADAS"
  resultados_indicadores: "03_RESULTADOS_E_INDICADORES"
  comunicacion: "04_COMUNICACION_Y_DIFUSION"
  participantes: "05_PARTICIPANTES_Y_COLABORADORES"
  desarrollo_plataforma: "06_DESARROLLO_PLATAFORMA"
  evidencias: "07_EVIDENCIAS"
  justificacion_economica: "08_JUSTIFICACION_ECONOMICA"
  desviaciones: "09_DESVIACIONES_Y_CAMBIOS"
  memoria_final: "10_MEMORIA_FINAL"
  modelos_normalizados: "11_MODELOS_NORMALIZADOS"

rutas_salida:
  outputs: "outputs"
  logs: "logs"
  inventario: "outputs/01_inventario/inventario_documental.csv"
  informe: "outputs/01_inventario/informe_inventario.md"
  plan_canonico: "outputs/02_plan_y_evidencias/plan_canonico.json"
  vinculos_evidencias: "outputs/02_plan_y_evidencias/vinculos_evidencias.csv"
  memoria_actividades: "outputs/05_modelos_normalizados/memoria_de_actividades.docx"
  memoria_economica: "outputs/05_modelos_normalizados/memoria_economica.xlsx"
  incidencias: "outputs/04_incidencias/reporte_incidencias.txt"
  tabla_incidencias_xlsx: "outputs/04_incidencias/tabla_incidencias.xlsx"
  tabla_incidencias_csv: "outputs/04_incidencias/tabla_incidencias.csv"
  relacion_gastos: "outputs/03_economica/relacion_facturas_gastos.csv"
  extraccion_facturas_campos: "outputs/03_economica/extraccion_facturas_campos.csv"
  revision_extraccion_facturas: "outputs/03_economica/revision_extraccion_facturas.csv"

extraccion_facturas:
  # Los valores con menor confianza se conservan, pero se marcan para revisión.
  confianza_revision_automatica: 0.90

plan_aprobado:
  patrones_cronograma:
    - "*Cronograma*.docx"
    - "*cronograma*.docx"

plantillas:
  actividades:
    carpeta: modelos_normalizados
    archivo: "memoria-de-actividades.docx"
  economica:
    carpeta: modelos_normalizados
    archivo: "memoria-economica-autonomos-.xlsx"

evidencias:
  areas:
    - actividades
    - resultados_indicadores
    - comunicacion
    - participantes
    - desarrollo_plataforma
    - evidencias
    - justificacion_economica
    - desviaciones

clasificacion:
  actividades:
    comunicacion: "instagram|redes|comunicaci[oó]n|social media"
    desarrollo: "desarrollo|platform|web|app|software"
    formacion: "formaci[oó]n|training|workshop"
    alianzas: "alianza|partner|colaboraci[oó]n"

opciones:
  incluir_archivos_ocultos: false
  calcular_hash: true
  detectar_duplicados: true
  extraer_texto: false
  sobrescribir_salidas: true

tipos_archivos:

  pdf:
    extensiones:
      - ".pdf"
    categoria: documento
    extractor: pymupdf
    editable: false
    permite_texto: true

  word:
    extensiones:
      - ".doc"
      - ".docx"
    categoria: documento
    extractor: python-docx
    editable: true
    permite_texto: true

  pages:
    extensiones:
      - ".pages"
    categoria: documento
    extractor: manual
    editable: true
    permite_texto: false

  excel:
    extensiones:
      - ".xls"
      - ".xlsx"
      - ".xlsm"
      - ".csv"
      - ".ods"
    categoria: hoja_calculo
    extractor: pandas
    editable: true
    permite_texto: true

  imagen:
    extensiones:
      - ".jpg"
      - ".jpeg"
      - ".png"
      - ".gif"
      - ".webp"
    categoria: imagen
    extractor: exif
    editable: false
    permite_texto: false

  video:
    extensiones:
      - ".mp4"
      - ".mov"
      - ".avi"
      - ".mkv"
      - ".m4v"
      - ".webm"
    categoria: audiovisual
    extractor: ffprobe
    editable: false
    permite_texto: false

  audio:
    extensiones:
      - ".wav"
      - ".mp3"
      - ".aiff"
    categoria: audiovisual
    extractor: metadata
    editable: false
    permite_texto: false

  comprimido:
    extensiones:
      - ".zip"
      - ".rar"
      - ".7z"
    categoria: comprimido
    extractor: ninguno
    editable: false
    permite_texto: false

  metadatos:

    idioma: es

    zona_horaria: Europe/Madrid

    moneda: EUR

    formato_fecha: ISO8601

    clasificacion:
      detectar_fechas: true
      detectar_importes: true
      detectar_personas: true
      detectar_entidades: true
      detectar_actividades: true

    hash:
      algoritmo: sha256